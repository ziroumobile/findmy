<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find Mine</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f2f2f7;--card:#fff;--fg:#111;--mute:#6b7280;--acc:#0a84ff;--bad:#ff3b30;--line:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--mute:#9ca3af;--line:#2c2c2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
button,input{font:inherit}
.hidden{display:none!important}
#login{max-width:340px;margin:12vh auto;padding:0 16px;display:grid;gap:10px}
#login h1{margin:0 0 6px;font-size:28px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{padding:11px 14px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:var(--card);color:var(--acc);border:1px solid var(--line)}
button.bad{background:var(--bad)}
#msg{color:var(--bad);min-height:1.2em;font-size:13px}
#app{display:grid;grid-template-rows:1fr auto;height:100dvh}
#map{width:100%;height:100%;min-height:0}
#panel{background:var(--card);border-radius:18px 18px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));max-height:48dvh;overflow:auto;box-shadow:0 -4px 20px rgba(0,0,0,.15);z-index:500}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.top b{font-size:17px}
.dev{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;color:var(--fg);border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px}
.dev.sel{color:var(--acc)}
.dev small{color:var(--mute);display:block}
.tag{font-size:11px;background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
.tag.lost{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
#lostBanner{position:fixed;inset:0;z-index:2000;background:var(--bad);color:#fff;display:grid;place-content:center;text-align:center;padding:24px;gap:12px}
#lostBanner h2{margin:0;font-size:30px}
#ringBar{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:1500;background:var(--acc);color:#fff;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center}
#ringBar button{background:#fff;color:var(--acc)}
</style>
</head>
<body>
<div id="login" class="hidden">
  <h1>Find Mine</h1>
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="password" type="password" placeholder="Password (min 6)" autocomplete="current-password">
  <button id="btnSignIn">登入</button>
  <button id="btnSignUp" class="sec">註冊</button>
  <div id="msg"></div>
</div>

<div id="app" class="hidden">
  <div id="map"></div>
  <div id="panel">
    <div class="top"><b>我的裝置</b><span><button id="btnAdd" class="sec">＋ 註冊此裝置</button> <button id="btnOut" class="sec">登出</button></span></div>
    <div id="list"></div>
    <div id="detail"></div>
  </div>
</div>

<div id="ringBar" class="hidden"><span>🔔 正在響鈴</span><button id="btnStopRing">停止</button></div>
<div id="lostBanner" class="hidden"><h2>此裝置已遺失</h2><div id="lostText"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
